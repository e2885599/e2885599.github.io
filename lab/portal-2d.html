<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>傳送門小遊戲</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#05070d; overflow:hidden; font-family:"Segoe UI","Microsoft JhengHei",sans-serif; color:#cfe8ff; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { background:#0a0f1a; image-rendering:auto; box-shadow:0 0 60px rgba(56,189,248,.25); }
  .overlay {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(20,40,70,.92), rgba(2,4,8,.97));
    z-index:10; text-align:center;
  }
  .panel { max-width:640px; padding:36px 44px; border:1px solid #1d3b5c; border-radius:14px; background:rgba(8,16,28,.85); }
  .panel h1 { font-size:34px; letter-spacing:2px; margin-bottom:8px;
    background:linear-gradient(90deg,#38bdf8,#fb923c); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .panel p { color:#9cc3e0; line-height:1.7; margin:10px 0; font-size:15px; }
  .btnrow { display:flex; gap:18px; justify-content:center; margin-top:22px; flex-wrap:wrap; }
  button.mode {
    cursor:pointer; font-size:18px; padding:14px 30px; border-radius:10px; border:2px solid;
    background:transparent; color:#cfe8ff; transition:.15s; font-weight:600;
  }
  button.easy { border-color:#38bdf8; } button.easy:hover { background:#38bdf8; color:#04121f; }
  button.hard { border-color:#fb923c; } button.hard:hover { background:#fb923c; color:#2a1204; }
  .keys { margin-top:18px; font-size:13px; color:#6f93b3; line-height:1.9; }
  kbd { background:#11233a; border:1px solid #28486a; border-radius:5px; padding:1px 7px; color:#bfe0ff; font-family:monospace; }
  .hidden { display:none !important; }
  #toast { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:20;
    background:rgba(8,16,28,.9); border:1px solid #2a4d72; padding:8px 18px; border-radius:20px;
    color:#bfe0ff; font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>

<div id="toast"></div>

<!-- 開始選單 -->
<div id="menu" class="overlay">
  <div class="panel">
    <h1>傳送門小遊戲</h1>
    <p>這是一個小小傳送門遊戲。你會有兩個門：藍門和橘門。走進一個門，就會從另一個門出來。一共有 5 關。</p>
    <p style="color:#7fd0ff">選一個難度開始玩：</p>
    <div class="btnrow">
      <button class="mode easy" onclick="startGame('easy')">簡單</button>
      <button class="mode hard" onclick="startGame('hard')">難一點</button>
    </div>
  <div class="keys">
    按 <kbd>A</kbd> 或 <kbd>D</kbd>（也可用 <kbd>←</kbd><kbd>→</kbd>）走路 ·
    <kbd>空白</kbd> 或 <kbd>W</kbd>（也可用 <kbd>↑</kbd>）跳 ·
    <kbd>滑鼠左鍵</kbd> 放藍門 · <kbd>右鍵</kbd> 放橘門<br>
    <kbd>E</kbd> 拿起或放下方塊 · <kbd>R</kbd> 重玩這關 · <kbd>Esc</kbd> 回主畫面<br>
    <span style="color:#fb923c">難一點：碰到刺刺要重來，還要比快。簡單：不會死，慢慢玩。</span>
  </div>
  </div>
</div>

<!-- 過關 / 通關 -->
<div id="win" class="overlay hidden">
  <div class="panel">
    <h1 id="winTitle">過關了！</h1>
    <p id="winText"></p>
    <div class="btnrow">
      <button class="mode easy" id="winNext" onclick="nextLevel()">下一關</button>
      <button class="mode hard" onclick="backToMenu()">回主畫面</button>
    </div>
  </div>
</div>

<script>
"use strict";
const W = 1280, H = 720;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ---------- 物理常數 ----------
const GRAV = 2200;      // px/s^2
const MOVE = 320;       // 水平速度
const JUMP = -760;      // 跳躍初速
const PR = 14;          // 玩家半徑
const CR = 16;          // 方塊半徑
const PLEN = 96;        // 傳送門長度

const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const len = (x,y)=> Math.hypot(x,y);

// ---------- 關卡定義 ----------
// 牆: {x,y,w,h,portalable}   方塊: {x,y}   按鈕: {x,y,w,h,door}   門: {x,y,w,h,id}   終點: {x,y,r}
// 可解性證明（所有關卡）：玩家恆在左側出生，右牆恆可從左側直視 →
//   藍門打左牆、橙門打右牆，走進左牆即從右牆出（動量守恆），繞過深淵/障礙。
//   方塊關：帶著方塊過門到右側，壓按鈕開門，再走到終點。門必在按鈕與終點之間形成閘門。
const LEVELS = [
  { // 1 穿越深淵
    name:"第 1 關：跳過大洞",
    intro:"用左鍵在左邊的牆上放藍門，用右鍵在右邊的牆上放橘門。然後往左走進藍門，你就會從橘門出來，到對面。中間的大洞掉下去要重來（難一點模式碰到刺刺也會重來）。",
    spawn:{x:140,y:600}, goal:{x:1100,y:600,r:26},
    walls:[
      {x:0,y:0,w:1280,h:40,portalable:true},     // 天花板
      {x:0,y:0,w:40,h:720,portalable:true},      // 左牆
      {x:1240,y:0,w:40,h:720,portalable:true},   // 右牆
      {x:0,y:680,w:560,h:40,portalable:true},    // 左地板
      {x:720,y:680,w:560,h:40,portalable:true},  // 右地板
    ],
    cubes:[], buttons:[], doors:[],
    hardHazards:[ {x:560,y:680,w:160,h:40} ],    // 深淵尖刺
  },
  { // 2 雙重深淵
    name:"第 2 關：兩個大洞",
    intro:"這裡有兩個大洞。一樣用左邊藍門、右邊橘門走過去。門會帶你直接跳過大洞。小祕訣：從高處掉進地上的門，會從牆上的門飛出去。",
    spawn:{x:120,y:600}, goal:{x:1120,y:600,r:26},
    walls:[
      {x:0,y:0,w:1280,h:40,portalable:true},
      {x:0,y:0,w:40,h:720,portalable:true},
      {x:1240,y:0,w:40,h:720,portalable:true},
      {x:0,y:680,w:420,h:40,portalable:true},    // 左地板
      {x:560,y:680,w:240,h:40,portalable:true},  // 中地板
      {x:900,y:680,w:380,h:40,portalable:true},  // 右地板
    ],
    cubes:[], buttons:[], doors:[],
    hardHazards:[ {x:420,y:680,w:140,h:40}, {x:800,y:680,w:100,h:40} ],
  },
  { // 3 方塊與按鈕
    name:"第 3 關：方塊開門",
    intro:"前面有一道門擋住路。用 E 拿起紅色愛心方塊，帶它走進門到對面，再把方塊放在地上的開關上，門就會打開。最後走到閃光的圈圈就過關。",
    spawn:{x:140,y:600}, goal:{x:900,y:600,r:26},
    walls:[
      {x:0,y:0,w:1280,h:40,portalable:true},
      {x:0,y:0,w:40,h:720,portalable:true},
      {x:1240,y:0,w:40,h:720,portalable:true},
      {x:0,y:680,w:560,h:40,portalable:true},    // 左地板
      {x:720,y:680,w:560,h:40,portalable:true},  // 右地板
    ],
    cubes:[ {x:140,y:640} ],
    buttons:[ {x:1100,y:660,w:70,h:20,door:"d1"} ],
    doors:[ {x:980,y:430,w:40,h:250,id:"d1"} ],
    hardHazards:[ {x:560,y:680,w:160,h:40} ],
  },
  { // 4 組合考驗
    name:"第 4 關：大洞加開門",
    intro:"跟上一關一樣，但大洞更寬、刺刺更多。拿方塊過門、放開關開門、再走到圈圈。小心不要掉下去。",
    spawn:{x:140,y:600}, goal:{x:900,y:600,r:26},
    walls:[
      {x:0,y:0,w:1280,h:40,portalable:true},
      {x:0,y:0,w:40,h:720,portalable:true},
      {x:1240,y:0,w:40,h:720,portalable:true},
      {x:0,y:680,w:520,h:40,portalable:true},    // 左地板
      {x:760,y:680,w:520,h:40,portalable:true},  // 右地板
    ],
    cubes:[ {x:140,y:640} ],
    buttons:[ {x:1120,y:660,w:70,h:20,door:"d1"} ],
    doors:[ {x:1000,y:430,w:40,h:250,id:"d1"} ],
    hardHazards:[ {x:520,y:680,w:240,h:40} ],
  },
  { // 5 終章
    name:"第 5 關：最後一關",
    intro:"最後一關！有方塊、開關、門，還有最寬的大洞和刺刺。拿方塊過門、開門、走到圈圈就贏了。難一點模式掉下去要重來。",
    spawn:{x:140,y:600}, goal:{x:880,y:600,r:26},
    walls:[
      {x:0,y:0,w:1280,h:40,portalable:true},
      {x:0,y:0,w:40,h:720,portalable:true},
      {x:1240,y:0,w:40,h:720,portalable:true},
      {x:0,y:680,w:540,h:40,portalable:true},    // 左地板
      {x:740,y:680,w:540,h:40,portalable:true},  // 右地板
    ],
    cubes:[ {x:140,y:640} ],
    buttons:[ {x:1140,y:660,w:70,h:20,door:"d1"} ],
    doors:[ {x:1020,y:430,w:40,h:250,id:"d1"} ],
    hardHazards:[ {x:540,y:680,w:200,h:40} ],
  },
];

// ---------- 遊戲狀態 ----------
let state = null;
let mode = "easy";
let curLevel = 0;
let lastT = 0, elapsed = 0;
const keys = {};
let mouse = {x:W/2, y:H/2, left:false, right:false};

function initLevel(idx){
  const L = LEVELS[idx];
  // 深拷貝動態物件
  const walls = L.walls.map(w=>({...w}));
  const cubes = (L.cubes||[]).map((c,i)=>({x:c.x,y:c.y,vx:0,vy:0,r:CR,held:false,id:i}));
  const buttons = (L.buttons||[]).map(b=>({...b, pressed:false}));
  const doors = (L.doors||[]).map(d=>({...d, open:false}));
  const hazards = (mode==="hard" ? (L.hardHazards||[]) : []).map(h=>({...h}));
  state = {
    name:L.name, intro:L.intro, idx,
    walls, cubes, buttons, doors, hazards,
    goal:{...L.goal},
    spawn:{...L.spawn},
    player:{x:L.spawn.x, y:L.spawn.y, vx:0, vy:0, r:PR, onGround:false},
    portals:[],          // {side:'blue'|'orange', x,y,nx,ny,tx,ty,len}
    carry:null,
    cooldown:0,
    dead:false, deadFlash:0,
    won:false,
    introTimer:4.0,
  };
  elapsed = 0;
}

// ---------- 輸入 ----------
window.addEventListener("keydown", e=>{
  keys[e.key.toLowerCase()] = true;
  if(e.key===" "||e.key==="ArrowUp"||e.key==="ArrowDown") e.preventDefault();
  if(e.key.toLowerCase()==="e" && state && !state.won) tryToggleCarry();
  if(e.key.toLowerCase()==="r" && state && !state.won) initLevel(state.idx);
  if(e.key==="Escape") backToMenu();
});
window.addEventListener("keyup", e=>{ keys[e.key.toLowerCase()] = false; });

function canvasToWorld(e){
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX - r.left) * (W / r.width), y:(e.clientY - r.top) * (H / r.height) };
}
canvas.addEventListener("mousemove", e=>{ const p=canvasToWorld(e); mouse.x=p.x; mouse.y=p.y; });
canvas.addEventListener("contextmenu", e=> e.preventDefault());
canvas.addEventListener("mousedown", e=>{
  if(!state || state.won) return;
  const p = canvasToWorld(e);
  mouse.x=p.x; mouse.y=p.y;
  if(e.button===0) placePortal("blue", p.x, p.y);
  else if(e.button===2) placePortal("orange", p.x, p.y);
});
canvas.addEventListener("mouseup", e=>{ if(e.button===0) mouse.left=false; if(e.button===2) mouse.right=false; });

// ---------- 傳送門放置 (射線檢測可門化牆面) ----------
function intersectSegAABB(ox,oy,dx,dy,w){
  let tmin=0, tmax=1, nx=0, ny=0;
  if(Math.abs(dx)<1e-9){ if(ox<w.x||ox>w.x+w.w) return null; }
  else {
    const inv=1/dx, t1=(w.x-ox)*inv, t2=(w.x+w.w-ox)*inv; let n=[-1,0];
    let a=t1,b=t2; if(a>b){[a,b]=[b,a]; n=[1,0];}
    if(a>tmin){ tmin=a; nx=n[0]; ny=n[1]; }
    if(b<tmax) tmax=b; if(tmin>tmax) return null;
  }
  if(Math.abs(dy)<1e-9){ if(oy<w.y||oy>w.y+w.h) return null; }
  else {
    const inv=1/dy, t1=(w.y-oy)*inv, t2=(w.y+w.h-oy)*inv; let n=[0,-1];
    let a=t1,b=t2; if(a>b){[a,b]=[b,a]; n=[0,1];}
    if(a>tmin){ tmin=a; nx=n[0]; ny=n[1]; }
    if(b<tmax) tmax=b; if(tmin>tmax) return null;
  }
  if(tmin<0||tmin>1) return null;
  return { t:tmin, nx, ny, x:ox+dx*tmin, y:oy+dy*tmin };
}
function placePortal(side, mx, my){
  const p = state.player;
  const dx = mx - p.x, dy = my - p.y;
  if(len(dx,dy) < 1) return;
  let best=null;
  for(const w of state.walls){
    if(!w.portalable) continue;
    const hit = intersectSegAABB(p.x, p.y, dx, dy, w);
    if(hit && (!best || hit.t < best.t)) best = hit;
  }
  if(!best){ toast("這裡不能放門（要對著藍色或橘色的牆）"); return; }
  // 法線指向房間內部 (hit normal)，切線與法線垂直
  const nx=best.nx, ny=best.ny;
  const tx=-ny, ty=nx;
  const hit = clampPortalOnWall(best, {nx,ny}, PLEN);
  // 替換同色門
  state.portals = state.portals.filter(pt=> pt.side!==side);
  state.portals.push({ side, x:hit.x, y:hit.y, nx, ny, tx, ty, len:PLEN });
}
function clampPortalOnWall(hit, frame, plen){
  // 用命中點回溯找到真正命中的可門化牆，並把門夾在牆面範圍內
  let wall=null;
  for(const w of state.walls){
    if(!w.portalable) continue;
    if(hit.x>=w.x-1 && hit.x<=w.x+w.w+1 && hit.y>=w.y-1 && hit.y<=w.y+w.h+1){ wall=w; break; }
  }
  if(!wall) return hit;
  let {x,y} = hit;
  if(Math.abs(frame.nx) > 0.5){ // 垂直面 -> 沿 y 夾取
    const lo = wall.y + plen/2, hi = wall.y + wall.h - plen/2;
    y = clamp(y, lo, hi);
  } else { // 水平面 -> 沿 x 夾取
    const lo = wall.x + plen/2, hi = wall.x + wall.w - plen/2;
    x = clamp(x, lo, hi);
  }
  return { ...hit, x, y };
}

// 未開啟的門視為實心牆，擋住玩家與方塊
function collideDoors(ent, r){
  for(const d of state.doors){
    if(d.open) continue;
    const hit = resolveCircleRect(ent, r, d);
    if(hit){
      ent.x += hit.nx*hit.pen; ent.y += hit.ny*hit.pen;
      const vn = ent.vx*hit.nx + ent.vy*hit.ny;
      if(vn < 0){ ent.vx -= vn*hit.nx; ent.vy -= vn*hit.ny; }
    }
  }
}

// ---------- 拿起 / 放下方塊 ----------
function tryToggleCarry(){
  const p = state.player;
  if(state.carry){
    const c = state.carry;
    c.held = false;
    c.vx = p.vx; c.vy = -200;
    state.carry = null;
    return;
  }
  let bestC=null, bd=1e9;
  for(const c of state.cubes){
    if(c.held) continue;
    const d = len(c.x-p.x, c.y-p.y);
    if(d < 46 && d < bd){ bd=d; bestC=c; }
  }
  if(bestC){ bestC.held=true; state.carry=bestC; }
}

// ---------- 碰撞：圓 vs 矩形 ----------
function resolveCircleRect(ent, r, w){
  const cx = clamp(ent.x, w.x, w.x+w.w);
  const cy = clamp(ent.y, w.y, w.y+w.h);
  let dx = ent.x-cx, dy = ent.y-cy;
  let d2 = dx*dx+dy*dy;
  if(d2 > r*r) return null;
  let nx, ny, pen;
  if(d2 > 1e-6){ const d=Math.sqrt(d2); nx=dx/d; ny=dy/d; pen=r-d; }
  else {
    const l=ent.x-w.x, rr=w.x+w.w-ent.x, t=ent.y-w.y, b=w.y+w.h-ent.y;
    const m=Math.min(l,rr,t,b);
    if(m===l){nx=-1;ny=0;pen=r+l;} else if(m===rr){nx=1;ny=0;pen=r+rr;}
    else if(m===t){nx=0;ny=-1;pen=r+t;} else {nx=0;ny=1;pen=r+b;}
  }
  return {nx,ny,pen};
}
function collideWalls(ent, r){
  let grounded=false;
  for(let pass=0; pass<3; pass++){
    for(const w of state.walls){
      if(w.isDoor && w.open) continue;
      const hit = resolveCircleRect(ent, r, w);
      if(hit){
        ent.x += hit.nx*hit.pen; ent.y += hit.ny*hit.pen;
        const vn = ent.vx*hit.nx + ent.vy*hit.ny;
        if(vn < 0){ ent.vx -= vn*hit.nx; ent.vy -= vn*hit.ny; }
        if(hit.ny < -0.5) grounded=true;
      }
    }
  }
  return grounded;
}

// ---------- 傳送門穿越 ----------
function tryTeleport(ent, r){
  if(state.cooldown > 0) return false;
  if(state.portals.length < 2) return false;
  const [A,B] = state.portals;
  for(const pair of [[A,B],[B,A]]){
    const P=pair[0], Q=pair[1];
    const rx = ent.x-P.x, ry = ent.y-P.y;
    const dn = rx*P.nx + ry*P.ny;          // 沿法線距離(>0 在房內)
    const dt = rx*P.tx + ry*P.ty;          // 沿切線距離
    if(Math.abs(dn) < r+4 && Math.abs(dt) < P.len/2 && (ent.vx*P.nx+ent.vy*P.ny) < 0){
      // 速度分解：進入 P，射出 Q
      const vn = ent.vx*P.nx + ent.vy*P.ny;   // 負值(朝向牆)
      const vt = ent.vx*P.tx + ent.vy*P.ty;
      ent.vx = Q.nx*(-vn) + Q.tx*vt;
      ent.vy = Q.ny*(-vn) + Q.ty*vt;
      ent.x = Q.x + Q.nx*(r+3);
      ent.y = Q.y + Q.ny*(r+3);
      state.cooldown = 0.12;
      return true;
    }
  }
  return false;
}

// ---------- 按鈕 / 門 ----------
function updateButtonsDoors(){
  for(const b of state.buttons){
    let pressed=false;
    for(const c of state.cubes){ if(!c.held && Math.abs(c.x-(b.x+b.w/2))<b.w/2+10 && Math.abs(c.y-(b.y+b.h/2))<b.h/2+18) pressed=true; }
    const p=state.player;
    if(Math.abs(p.x-(b.x+b.w/2))<b.w/2+10 && Math.abs(p.y-(b.y+b.h/2))<b.h/2+18) pressed=true;
    b.pressed=pressed;
  }
  for(const d of state.doors){ d.open = state.buttons.some(b=> b.door===d.id && b.pressed); }
}

// ---------- 主更新 ----------
function update(dt){
  if(!state || state.won) return;
  if(state.introTimer>0) state.introTimer -= dt;
  if(state.cooldown>0) state.cooldown -= dt;
  if(state.deadFlash>0){ state.deadFlash -= dt; if(state.deadFlash<=0){ hardRespawn(); } return; }

  elapsed += dt;
  const p = state.player;

  // 水平輸入
  let ax=0;
  if(keys["a"]||keys["arrowleft"]) ax-=1;
  if(keys["d"]||keys["arrowright"]) ax+=1;
  p.vx = ax*MOVE;
  // 跳躍
  if((keys[" "]||keys["w"]||keys["arrowup"]) && p.onGround){ p.vy = JUMP; p.onGround=false; }
  // 重力
  p.vy += GRAV*dt;
  if(p.vy>1400) p.vy=1400;

  // 積分 + 子步進以提升穩定
  const sub=2, sdt=dt/sub;
  for(let s=0;s<sub;s++){
    p.x += p.vx*sdt; p.y += p.vy*sdt;
    tryTeleport(p, p.r);
    collideDoors(p, p.r);
    p.onGround = collideWalls(p, p.r);
  }

  // 拿著方塊跟隨
  if(state.carry){ const c=state.carry; c.x=p.x; c.y=p.y-(p.r+c.r+2); c.vx=0; c.vy=0; }

  // 方塊物理
  for(const c of state.cubes){
    if(c.held) continue;
    c.vy += GRAV*dt; if(c.vy>1400) c.vy=1400;
    const sub2=2, s2=dt/sub2;
    for(let s=0;s<sub2;s++){
      c.x += c.vx*s2; c.y += c.vy*s2;
      tryTeleport(c, c.r);
      collideDoors(c, c.r);
      collideWalls(c, c.r);
    }
  }

  updateButtonsDoors();

  // 機關 (困難尖刺) / 墜落
  if(mode==="hard"){
    for(const hz of state.hazards){
      if(p.x>hz.x && p.x<hz.x+hz.w && p.y+h.r>hz.y && p.y-p.r<hz.y+hz.h){ die(); break; }
    }
  }
  if(p.y > H+60){ // 掉出世界
    if(mode==="hard") die(); else { p.x=state.spawn.x; p.y=state.spawn.y; p.vx=0; p.vy=0; }
  }

  // 抵達終點
  const g=state.goal;
  if(len(p.x-g.x, p.y-g.y) < g.r + p.r - 4){ winLevel(); }
}

function die(){
  state.dead=true; state.deadFlash=0.6;
}
function hardRespawn(){
  const idx=state.idx;
  initLevel(idx);
  state.deadFlash=0;
}

// ---------- 過關 / 流程 ----------
function winLevel(){
  state.won=true;
  const t = elapsed;
  if(curLevel >= LEVELS.length-1){
    document.getElementById("winTitle").textContent = "🏆 全部過關！";
    document.getElementById("winText").innerHTML =
      `你 5 關都過了（${mode==="easy"?"簡單":"難一點"}模式）。<br>一共花了 <b>${t.toFixed(1)}</b> 秒。`;
    document.getElementById("winNext").textContent = "再玩一次";
    document.getElementById("winNext").setAttribute("onclick","restartAll()");
  } else {
    document.getElementById("winTitle").textContent = "✅ 過關了！";
    document.getElementById("winText").innerHTML =
      `${state.name} 這關過了！<br>這關花了 <b>${t.toFixed(1)}</b> 秒。` +
      (mode==="hard"?`<br><span style="color:#fb923c">挑戰：下次試著更快過關。</span>`:``);
    document.getElementById("winNext").textContent = "下一關";
    document.getElementById("winNext").setAttribute("onclick","nextLevel()");
  }
  document.getElementById("win").classList.remove("hidden");
}
function nextLevel(){ document.getElementById("win").classList.add("hidden"); curLevel++; initLevel(curLevel); }
function restartAll(){ document.getElementById("win").classList.add("hidden"); curLevel=0; initLevel(0); }
function backToMenu(){ document.getElementById("win").classList.add("hidden"); document.getElementById("menu").classList.remove("hidden"); state=null; }
function startGame(m){ mode=m; curLevel=0; document.getElementById("menu").classList.add("hidden"); initLevel(0); lastT=performance.now(); }

// ---------- 渲染 ----------
function draw(){
  ctx.clearRect(0,0,W,H);
  // 背景網格
  ctx.fillStyle="#070c16"; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(40,80,120,.12)"; ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  if(!state) return;

  // 牆
  for(const w of state.walls){
    if(w.isDoor) continue;
    ctx.fillStyle = w.portalable ? "#16314e" : "#2a2f3a";
    ctx.fillRect(w.x,w.y,w.w,w.h);
    if(w.portalable){
      ctx.strokeStyle="rgba(56,189,248,.35)"; ctx.lineWidth=1;
      ctx.strokeRect(w.x+1,w.y+1,w.w-2,w.h-2);
    }
  }
  // 門
  for(const d of state.doors){
    if(d.open){
      ctx.fillStyle="rgba(80,255,160,.08)";
      ctx.strokeStyle="rgba(80,255,160,.4)"; ctx.setLineDash([6,6]);
      ctx.strokeRect(d.x,d.y,d.w,d.h); ctx.setLineDash([]);
    } else {
      ctx.fillStyle="#7a3b1a"; ctx.fillRect(d.x,d.y,d.w,d.h);
      ctx.strokeStyle="#fb923c"; ctx.lineWidth=2; ctx.strokeRect(d.x,d.y,d.w,d.h);
    }
  }
  // 尖刺(困難)
  for(const hz of state.hazards){
    ctx.fillStyle="#b91c1c";
    const n=Math.max(1,Math.floor(hz.w/20));
    for(let i=0;i<n;i++){
      const bx=hz.x+i*(hz.w/n);
      ctx.beginPath(); ctx.moveTo(bx,hz.y+hz.h); ctx.lineTo(bx+hz.w/n/2,hz.y); ctx.lineTo(bx+hz.w/n,hz.y+hz.h); ctx.closePath(); ctx.fill();
    }
  }
  // 按鈕
  for(const b of state.buttons){
    ctx.fillStyle = b.pressed ? "#22c55e" : "#cbd5e1";
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle = b.pressed ? "#86efac" : "#64748b"; ctx.lineWidth=2; ctx.strokeRect(b.x,b.y,b.w,b.h);
  }
  // 終點
  const g=state.goal;
  const pulse = 0.5+0.5*Math.sin(performance.now()/300);
  ctx.strokeStyle=`rgba(56,189,248,${0.5+0.5*pulse})`; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(g.x,g.y,g.r,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle=`rgba(56,189,248,${0.15+0.15*pulse})`; ctx.beginPath(); ctx.arc(g.x,g.y,g.r*0.6,0,Math.PI*2); ctx.fill();

  // 傳送門
  for(const pt of state.portals){
    const col = pt.side==="blue" ? "#38bdf8" : "#fb923c";
    ctx.save();
    ctx.translate(pt.x,pt.y); ctx.rotate(Math.atan2(pt.ty,pt.tx));
    ctx.shadowColor=col; ctx.shadowBlur=18;
    ctx.strokeStyle=col; ctx.lineWidth=10; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(-pt.len/2,0); ctx.lineTo(pt.len/2,0); ctx.stroke();
    ctx.shadowBlur=0; ctx.strokeStyle="rgba(255,255,255,.7)"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(-pt.len/2,0); ctx.lineTo(pt.len/2,0); ctx.stroke();
    ctx.restore();
  }

  // 方塊 (伴侶方塊風格)
  for(const c of state.cubes){
    ctx.save(); ctx.translate(c.x,c.y);
    ctx.fillStyle="#e2e8f0"; ctx.fillRect(-c.r,-c.r,c.r*2,c.r*2);
    ctx.strokeStyle="#94a3b8"; ctx.lineWidth=2; ctx.strokeRect(-c.r,-c.r,c.r*2,c.r*2);
    ctx.fillStyle="#fb7185"; ctx.beginPath(); ctx.arc(0,0,c.r*0.45,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(-3,-3,2,0,Math.PI*2); ctx.arc(3,-3,2,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // 玩家 + 瞄準槍
  const p=state.player;
  ctx.strokeStyle="rgba(191,224,255,.5)"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(mouse.x,mouse.y); ctx.stroke();
  ctx.fillStyle="#e0f2fe"; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#38bdf8"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.stroke();

  // 準星
  ctx.strokeStyle="rgba(255,255,255,.6)"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(mouse.x,mouse.y,8,0,Math.PI*2); ctx.moveTo(mouse.x-12,mouse.y); ctx.lineTo(mouse.x+12,mouse.y);
  ctx.moveTo(mouse.x,mouse.y-12); ctx.lineTo(mouse.x,mouse.y+12); ctx.stroke();

  // HUD
  ctx.fillStyle="#bfe0ff"; ctx.font="bold 20px Segoe UI"; ctx.textAlign="left";
  ctx.fillText(state.name, 20, 32);
  ctx.font="14px Segoe UI"; ctx.fillStyle="#7fb3d8";
  ctx.fillText(`難度：${mode==="easy"?"簡單":"難一點"}　時間：${elapsed.toFixed(1)} 秒`, 20, 54);
  ctx.textAlign="right";
  ctx.fillText(`第 ${state.idx+1} / ${LEVELS.length} 關`, W-20, 32);
  ctx.textAlign="left";

  // 死亡閃爍
  if(state.deadFlash>0){ ctx.fillStyle=`rgba(185,28,28,${0.4*state.deadFlash/0.6})`; ctx.fillRect(0,0,W,H); }

  // 關卡引導
  if(state.introTimer>0){
    ctx.fillStyle="rgba(8,16,28,.82)"; ctx.fillRect(W/2-360, H-130, 720, 78);
    ctx.strokeStyle="#2a4d72"; ctx.strokeRect(W/2-360, H-130, 720, 78);
    ctx.fillStyle="#bfe0ff"; ctx.font="15px Segoe UI"; ctx.textAlign="center";
    wrapText(state.intro, W/2, H-104, 680, 20);
    ctx.textAlign="left";
  }
}
function wrapText(text,cx,y,maxw,lh){
  const words=text.split(""); let line="", yy=y;
  for(const ch of words){
    if(ctx.measureText(line+ch).width>maxw){ ctx.fillText(line,cx,yy); line=ch; yy+=lh; }
    else line+=ch;
  }
  ctx.fillText(line,cx,yy);
}

// ---------- 主迴圈 ----------
function loop(now){
  const dt = Math.min(0.033, (now-lastT)/1000 || 0);
  lastT = now;
  if(state) update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- 小工具 ----------
let toastTimer=null;
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),1600);
}

// 自適應縮放
function fit(){
  const pad=20;
  const sw=window.innerWidth-pad, sh=window.innerHeight-pad;
  const s=Math.min(sw/W, sh/H);
  canvas.style.width=(W*s)+"px"; canvas.style.height=(H*s)+"px";
}
window.addEventListener("resize", fit); fit();
</script>
