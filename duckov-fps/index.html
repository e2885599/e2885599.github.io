<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>逃離鴨科夫 · FPS 原型</title>
<style>
  html,body{ margin:0; height:100%; background:#020617; overflow:hidden; font-family:"JetBrains Mono",monospace; }
  #game{ display:block; width:100vw; height:100vh; }
  #hud{ position:fixed; left:0; top:0; width:100%; height:100%; pointer-events:none; color:#22d3ee; text-shadow:0 1px 2px #000; }
  #cross{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:22px; color:#7dd3fc; }
  #stat{ position:absolute; left:12px; top:12px; font-size:12px; }
  #hpbar{ position:absolute; left:12px; bottom:48px; width:220px; height:14px; background:#1e293b; border:1px solid #475569; border-radius:7px; overflow:hidden; }
  #hpfill{ height:100%; width:100%; background:linear-gradient(90deg,#22d3ee,#34d399); transition:width .2s; }
  #mission{ position:absolute; left:12px; bottom:28px; font-size:11px; color:#cbd5e1; }
  #hint{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); color:#94a3b8; font-size:12px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
<script src="../assets/theme-map.js?v=20260827d"></script>
<script src="../assets/theme-inject.js?v=20260827d"></script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="hint">WASD 移動 ｜ 點擊畫面鎖定視角 ｜ 左鍵射擊 ｜ ESC 解除</div>
  <script type="module">
    import { boot } from './src/core/engine.js';
    boot('game').then(() => console.log('[OK] 引擎啟動+世界載入')).catch((e) => console.error('[FAIL]', e));
  </script>
</body>
</html>
