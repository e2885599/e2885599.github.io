<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0e1530"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36e0d4"/><stop offset="1" stop-color="#8b6cff"/>
    </linearGradient>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9fb3d1"/>
    </marker>
    <style>
      .box{fill:#13203f;stroke:#2a3d63;stroke-width:1.5;rx:10}
      .box2{fill:#16243f;stroke:#34507f;stroke-width:1.5}
      .lbl{fill:#e8eefc;font-size:15px;font-weight:600}
      .sub{fill:#9fb3d1;font-size:12px}
      .tag{fill:#36e0d4;font-size:11px;font-weight:700;letter-spacing:.5px}
      .ttl{fill:#cfe0ff;font-size:18px;font-weight:700}
      .acc{fill:#ff5d6c;font-size:11px;font-weight:700}
      .ln{stroke:#9fb3d1;stroke-width:2;fill:none;marker-end:url(#arw)}
    </style>
  </defs>

  <rect width="1280" height="820" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="56" fill="url(#hdr)" opacity="0.92"/>
  <text x="32" y="35" class="ttl" fill="#06121f">技能管線 · 電腦圖學版塊（CG Block）設計藍圖</text>
  <text x="980" y="35" class="tag" fill="#06121f">v0.1 · 設計場合</text>

  <!-- L0 調度層 -->
  <rect class="box" x="440" y="80" width="400" height="86" rx="12"/>
  <text x="460" y="112" class="tag">L0 · 調度層</text>
  <text x="460" y="136" class="lbl">遙遙技能包路由</text>
  <text x="460" y="156" class="sub">agent 接收「CAD／圖學任務」→ 依觸發條件路由至 CG Block</text>

  <path class="ln" d="M640,166 L640,196"/>

  <!-- L1 Blueprint 控制器 -->
  <rect class="box2" x="360" y="200" width="560" height="92" rx="12"/>
  <text x="380" y="232" class="tag">L1 · 設計場合控制器（本藍圖）</text>
  <text x="380" y="256" class="lbl">版塊邊界 · 輸入/輸出契約 · 對帳點</text>
  <text x="380" y="278" class="sub">定義參數schema、可重現種子、收據格式；任務前先查藍圖再執行</text>

  <path class="ln" d="M640,292 L640,330"/>

  <!-- 分流 -->
  <path class="ln" d="M640,330 L320,386"/>
  <path class="ln" d="M640,330 L960,386"/>

  <!-- Lane A FreeCAD -->
  <rect class="box" x="60" y="386" width="520" height="170" rx="12"/>
  <text x="80" y="416" class="tag">L2-A · FreeCAD 接入層（本機無頭）</text>
  <text x="80" y="440" class="lbl">D:\Program Files (x86)\free cad\bin\python.exe</text>
  <text x="80" y="462" class="sub">· 參數化建模（Part/BuildWorkbench 腳本化）</text>
  <text x="80" y="482" class="sub">· 匯出 STEP / STL / glTF（mesh 化）</text>
  <text x="80" y="502" class="sub">· 幾何校驗：體積/邊界框/BREP 有效性</text>
  <text x="80" y="522" class="sub">· 每次產出 → hash → 對帳鏈</text>
  <text x="80" y="546" class="acc">◆ 真實可用性已驗：import FreeCAD OK</text>

  <!-- Lane B 既有圖學技能包 -->
  <rect class="box" x="700" y="386" width="520" height="170" rx="12"/>
  <text x="720" y="416" class="tag">L2-B · 既有電腦圖學技能包</text>
  <text x="720" y="440" class="lbl">工作室技術實驗場（feature-interactive-lab:lab.html）</text>
  <text x="720" y="462" class="sub">· ① 圖形管線 WebGL 旋轉三角形</text>
  <text x="720" y="482" class="sub">· ② 幾何變換 Canvas2D（參數→矩陣→URL）</text>
  <text x="720" y="502" class="sub">· ③ 著色器每點顏色 + 立體方塊</text>
  <text x="720" y="522" class="sub">· 降級策略（WebGL→Canvas2D fallback）</text>
  <text x="720" y="546" class="acc">◆ 325 行完好存於 git 分支</text>

  <path class="ln" d="M320,556 L320,600 L640,600 L640,620"/>
  <path class="ln" d="M960,556 L960,600 L640,600"/>

  <!-- L3 對帳 -->
  <rect class="box2" x="300" y="620" width="680" height="92" rx="12"/>
  <text x="320" y="652" class="tag">L3 · 對帳 / 可證偽層（Merkle 收據）</text>
  <text x="320" y="676" class="lbl">參數種子 → 匯出 hash 鏈 → 收據 JSON</text>
  <text x="320" y="698" class="sub">· FreeCAD 匯出檔 sha256 入鏈　· WebGL 狀態可經 URL hash 重現</text>
  <text x="320" y="700" class="sub"> </text>

  <path class="ln" d="M640,712 L640,742"/>

  <!-- L4 輸出 -->
  <rect class="box" x="300" y="744" width="680" height="60" rx="12"/>
  <text x="320" y="772" class="tag">L4 · 輸出</text>
  <text x="320" y="792" class="sub">工作室網站技術實驗場升級　+　匯出檔(STEP/STL/glTF)　+　Merkle 收據</text>

  <!-- 邊界標註 -->
  <text x="32" y="800" class="sub">邊界：輸入=任務描述+參數；輸出=匯出檔+收據+可驗網頁。失敗不編造，回 read-error。</text>
</svg>
